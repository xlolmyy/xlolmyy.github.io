<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froschnite RPLACE</title>
    <link rel="stylesheet" href="sigma.css">
    <link rel="icon" type="image/x-icon" href="https://cdn.7tv.app/emote/60ff1f522a53ff4884302228/4x.webp">
</head>
<body>
    <div id="background"></div>
    <div id="headbar">
        <img src="https://cdn.7tv.app/emote/60ff1f522a53ff4884302228/4x.webp" alt="ok">
        <p id="bedgename">Gommehd r/place</p>
    </div>

    <div class="construction-banner">
        Website im Bau
    </div>

    <div class="main">
        <p class="heading" id="first_title">r/place</p>
        <p class="text">Hier findest du ein Overlay von verschiedenen Place-Bauwerken</p>
        <input type="text" id="searchInput" placeholder="Suche Projekte...">

        <div id="projects">
            <!-- Projekt-Karten hier -->
            <!-- deine Projekte... (wie oben, gekürzt hier) -->
        </div>

        <div id="no-results" style="display:none; text-align: center; margin-top: 30px;">
            <img id="sad-img" src="dein-traures-bild.png" alt=":(" style="width: 120px; margin-bottom: 10px;">
            <p>Kein Projekt gefunden. 😢</p>
        </div>

        <div id="suggest-box">
            <h3>Projekt vorschlagen</h3>
            <p>Du hast ein cooles Projekt? <a href="https://discord.gg/yourlink" target="_blank">Schlag es auf Discord vor!</a></p>
        </div>
    </div>

    <div id="lightbox" style="display:none">
        <span id="lightbox-close">×</span>
        <img id="lightbox-img" src="" alt="Lightbox Image">
    </div>

    <!-- Eingebautes JavaScript -->
    <script>
        // Suche mit Highlight & "Kein Ergebnis"-Anzeige
        document.addEventListener("DOMContentLoaded", function () {
            const searchInput = document.getElementById("searchInput");
            const projects = document.querySelectorAll(".project");
            const noResults = document.getElementById("no-results");

            searchInput.addEventListener("input", function () {
                const term = this.value.toLowerCase();
                let matchFound = false;

                projects.forEach((project) => {
                    const name = project.dataset.name.toLowerCase();
                    if (name.includes(term)) {
                        project.style.display = "block";
                        project.classList.add("highlight");
                        matchFound = true;
                    } else {
                        project.style.display = "none";
                        project.classList.remove("highlight");
                    }
                });

                // Zeige "Kein Ergebnis", wenn nichts gefunden wurde
                noResults.style.display = matchFound ? "none" : "block";

                // Wenn das Suchfeld leer ist, alles zeigen
                if (term === "") {
                    projects.forEach(p => {
                        p.style.display = "block";
                        p.classList.remove("highlight");
                    });
                    noResults.style.display = "none";
                }
            });
        });

        // Lightbox für Bilder
        document.querySelectorAll(".project img").forEach(img => {
            img.addEventListener("click", () => {
                document.getElementById("lightbox-img").src = img.src;
                document.getElementById("lightbox").style.display = "flex";
            });
        });

        document.getElementById("lightbox-close").addEventListener("click", () => {
            document.getElementById("lightbox").style.display = "none";
        });
    </script>
</body>
</html>

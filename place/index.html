<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froschnite RPLACE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://cdn.7tv.app/emote/60ff1f522a53ff4884302228/4x.webp">
</head>
<body>
    <div id="background"></div>
    <div id="headbar">
        <img src="https://cdn.7tv.app/emote/60ff1f522a53ff4884302228/4x.webp" alt="ok">
        <p id="bedgename">Gommehd r/place</p>
    </div>

    
    <div class="construction-banner">
        Website im Bau
    </div>
    <div class="main">
        <p class="heading" id="first_title">r/place</p>
        <p class="text">Hier findest du ein Overlay von verschiedenen Place-Bauwerken</p>
        <input type="text" id="searchInput" placeholder="Suche Projekte...">

        <div id="projects">
            <!-- Projekt-Karten hier -->
            <div class="project" data-name="froschnite">
                <a href="https://xlolmyy.github.io/place/froschnite/">Froschnite</a>
                <a href="https://xlolmyy.github.io/place/plan/froschnite.png" target="_blank">
                    <input type="button" value="Plan">
                </a>
                <img src="https://cdn.7tv.app/emote/621ab26aaff1c45709b4b2fa/4x.webp" alt="froschnite">
                <div class="coords">
                    <label>Koordinaten:</label>
                    <input type="text" value="123, 456" readonly onclick="navigator.clipboard.writeText(this.value)">
                </div>
            </div>

            <div class="project" data-name="aufjott">
                <a href="https://notle0nard.github.io/aufjott/">AufJott</a>
                <a href="https://xlolmyy.github.io/place/plan/aufjott.png" target="_blank">
                    <input type="button" value="Plan">
                </a>
                <img src="https://cdn.7tv.app/emote/64ff04ca6aaee579512ee6cf/4x.webp" alt="aufjott">
                <div class="coords">
                    <label>Koordinaten:</label>
                    <input type="text" value="321, 789" readonly onclick="navigator.clipboard.writeText(this.value)">
                </div>
            </div>

            <div class="project" data-name="cronxz">
                <a href="https://xlolmyy.github.io/place/cronxz/">cronxz</a>
                <a href="https://xlolmyy.github.io/place/plan/cronxz.png" target="_blank">
                    <input type="button" value="Plan">
                </a>
                <img src="https://kappa.lol/Y9jen" alt="cronxz">
                <div class="coords">
                    <label>Koordinaten:</label>
                    <input type="text" value="213, 654" readonly onclick="navigator.clipboard.writeText(this.value)">
                </div>
            </div>

            <div class="project" data-name="buhh">
                <a href="https://xlolmyy.github.io/place/buhh/">buhh</a>
                <a href="https://xlolmyy.github.io/place/plan/buhh.png" target="_blank">
                    <input type="button" value="Plan">
                </a>
                <img src="https://cdn.7tv.app/emote/61d679c83d52bb5c33c4f9a6/4x.webp" alt="buhh">
                <div class="coords">
                    <label>Koordinaten:</label>
                    <input type="text" value="555, 111" readonly onclick="navigator.clipboard.writeText(this.value)">
                </div>
            </div>

            <div class="project" data-name="plink">
                <a href="https://xlolmyy.github.io/place/plink/">plink</a>
                <a href="https://xlolmyy.github.io/place/plan/plink.png" target="_blank">
                    <input type="button" value="Plan">
                </a>
                <img src="https://cdn.7tv.app/emote/6501ea45bad3f314ff03f597/4x.webp" alt="plink">
                <div class="coords">
                    <label>Koordinaten:</label>
                    <input type="text" value="333, 222" readonly onclick="navigator.clipboard.writeText(this.value)">
                </div>
            </div>

            <div class="project" data-name="buh">
                <a href="https://xlolmyy.github.io/place/buh/">buh</a>
                <a href="https://xlolmyy.github.io/place/plan/buh.png" target="_blank">
                    <input type="button" value="Plan">
                </a>
                <img src="https://cdn.7tv.app/emote/63cec0c12ba67946677a463e/4x.webp" alt="buh">
                <div class="coords">
                    <label>Koordinaten:</label>
                    <input type="text" value="777, 888" readonly onclick="navigator.clipboard.writeText(this.value)">
                </div>
            </div>
        </div>

        <div id="no-results" style="display:none; text-align: center; margin-top: 30px;">
            <img id="sad-img" src="dein-traures-bild.png" alt=":(" style="width: 120px; margin-bottom: 10px;">
            <p>Kein Projekt gefunden. 😢</p>
        </div>

        <div id="suggest-box">
            <h3>Projekt vorschlagen</h3>
            <p>Du hast ein cooles Projekt? <a href="https://discord.gg/yourlink" target="_blank">Schlag es auf Discord vor!</a></p>
        </div>
    </div>

    <div id="lightbox" style="display:none">
        <span id="lightbox-close">×</span>
        <img id="lightbox-img" src="" alt="Lightbox Image">
    </div>

    <script src="script.js"></script>
</body>
</html>
